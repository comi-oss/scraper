[package]
name = "comi-scraper"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Extract Comifuro booth merchandise with OpenRouter vision"
repository = "https://github.com/comi-oss/scraper"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
mockito = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
